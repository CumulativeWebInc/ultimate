<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Ultimate — a living world · Cumulative Web Inc</title>
<link rel="stylesheet" href="sim.css">
<link rel="icon" href="assets/cwi-logo.jpg">
<meta name="description" content="Project Ultimate: a deterministic living-world simulation — 2Hz tick engine, append-only event log, pure renderer. CWI's agents live and work here, 24/7.">
</head>
<body>
<div id="camera">
<canvas id="sky" aria-label="Living archipelago world"></canvas>
<div id="stage" aria-label="Agent world"></div>
</div>

<div id="loading"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc">
  <div class="spin"></div><p>Waking the world…</p></div>

<div id="brand"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc"><span>PROJECT ULTIMATE</span></div>
<div id="world-clock"></div>
<div id="metrics" aria-label="Live world metrics"></div>

<div id="rules-panel" class="panel">
  <h3>World's Rules</h3>
  <div class="incoming">Only real, verifiable actions render in the world; nothing is faked.</div>
</div>

<button id="owner-toggle" aria-label="Toggle owner view">Owner view</button>
<div id="owner-panel" class="panel">
  <h3>Live Activity Ledger</h3>
  <div id="ledger-list"><div class="incoming">Ledger quiet — no activity yet.</div></div>
  <h3>Metric queries</h3>
  <div id="metric-queries"></div>
  <h3>Time of day</h3>
  <div class="owner-row">
    <input id="tod-range" type="range" min="0" max="24" step="0.5" value="12" aria-label="Time of day override">
    <span id="tod-label">live</span>
    <button id="tod-live">Live time</button>
  </div>
  <h3>Camera</h3>
  <div class="owner-row">
    <select id="follow-select" aria-label="Follow an agent"><option value="">Follow: none</option></select>
  </div>
</div>

<div id="feed-panel">
  <div id="feed-header"><h3>Live activity</h3><button id="feed-toggle" aria-label="Collapse activity feed">–</button></div>
  <div id="feed-list"><div class="incoming">Ledger quiet — no activity yet.</div></div>
</div>

<div id="nav-controls" role="toolbar" aria-label="Camera controls">
  <button id="cam-out" aria-label="Zoom out">−</button>
  <button id="cam-in" aria-label="Zoom in">+</button>
  <button id="cam-reset" aria-label="Reset view">⟲</button>
</div>

<div id="interior-overlay" class="hidden" role="dialog" aria-label="Island interior"></div>
<div id="status-card" role="dialog" aria-label="Agent status"></div>

<div id="watermark"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc"><span></span></div>

<script type="module" src="sim.js"></script>
</body>
</html>
