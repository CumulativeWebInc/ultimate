<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Ultimate — a living world · Cumulative Web Inc</title>
<link rel="stylesheet" href="sim.css">
<link rel="icon" href="assets/cwi-logo.jpg">
<meta name="description" content="Project Ultimate: a deterministic living-world simulation — 2Hz tick engine, append-only event log, pure renderer. CWI's agents live and work here, 24/7.">
</head>
<body>
<div id="camera">
<canvas id="sky" data-i18n-aria="world.canvas_label" aria-label="Living archipelago world"></canvas>
<div id="stage" data-i18n-aria="world.stage_label" aria-label="Agent world"></div>
</div>

<div id="loading"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc">
  <div class="spin"></div><p data-i18n="world.loading">Waking the world…</p></div>

<div id="brand"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc"><span>PROJECT ULTIMATE</span></div>
<div id="world-clock"></div>
<div id="metrics" data-i18n-aria="world.metrics_label" aria-label="Live world metrics"></div>

<div id="rules-panel" class="panel">
  <h3 data-i18n="world.rules_title">World's Rules</h3>
  <div class="incoming" data-i18n="world.rules_body">Only real, verifiable actions render in the world; nothing is faked.</div>
</div>

<button id="owner-toggle" data-i18n="world.owner_toggle" data-i18n-aria="world.owner_toggle_aria" aria-label="Toggle owner view">Owner view</button>
<div id="owner-panel" class="panel">
  <h3 data-i18n="world.ledger_title">Live Activity Ledger</h3>
  <div id="ledger-list"><div class="incoming" data-i18n="world.ledger_quiet">Ledger quiet — no activity yet.</div></div>
  <h3 data-i18n="world.metric_queries">Metric queries</h3>
  <div id="metric-queries"></div>
  <h3 data-i18n="world.time_of_day">Time of day</h3>
  <div class="owner-row">
    <input id="tod-range" type="range" min="0" max="24" step="0.5" value="12" data-i18n-aria="world.tod_aria" aria-label="Time of day override">
    <span id="tod-label">live</span>
    <button id="tod-live" data-i18n="world.live_time">Live time</button>
  </div>
  <h3 data-i18n="world.camera_title">Camera</h3>
  <div class="owner-row">
    <select id="follow-select" data-i18n-aria="world.follow_aria" aria-label="Follow an agent"><option value="">Follow: none</option></select>
  </div>
</div>

<div id="feed-panel">
  <div id="feed-header"><h3 data-i18n="world.feed_title">Live activity</h3><button id="feed-toggle" data-i18n-aria="world.feed_toggle_aria" aria-label="Collapse activity feed">–</button></div>
  <div id="feed-list"><div class="incoming" data-i18n="world.ledger_quiet">Ledger quiet — no activity yet.</div></div>
</div>

<div id="nav-controls" role="toolbar" data-i18n-aria="world.cam_controls_aria" aria-label="Camera controls">
  <button id="cam-out" data-i18n-aria="world.zoom_out" aria-label="Zoom out">−</button>
  <button id="cam-in" data-i18n-aria="world.zoom_in" aria-label="Zoom in">+</button>
  <button id="cam-reset" data-i18n-aria="world.reset_view" aria-label="Reset view">⟲</button>
</div>

<div id="interior-overlay" class="hidden" role="dialog" data-i18n-aria="world.interior_aria" aria-label="Island interior"></div>
<div id="status-card" role="dialog" data-i18n-aria="world.status_aria" aria-label="Agent status"></div>

<div id="watermark"><img src="assets/cwi-logo.jpg" alt="Cumulative Web Inc"><span></span></div>

<script type="module" src="sim.js"></script>
<script src="https://cumulativewebinc.github.io/cwi-i18n/i18n.js" data-app="ultimate"></script>
</body>
</html>
